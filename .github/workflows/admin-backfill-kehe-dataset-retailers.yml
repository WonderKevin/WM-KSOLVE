name: Admin Backfill KeHe Data Set Retailers

on:
  workflow_dispatch:

jobs:
  backfill-kehe-dataset-retailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Backfill retailer overrides from locations
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'NODE'
          const { createClient } = require("@supabase/supabase-js");

          const supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const serviceRoleKey = process.env.SUPABASE_SERVICE_ROLE_KEY;

          if (!supabaseUrl || !serviceRoleKey) {
            throw new Error("Missing NEXT_PUBLIC_SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY.");
          }

          const supabase = createClient(supabaseUrl, serviceRoleKey);
          const PAGE_SIZE = 1000;

          async function fetchAll(table, columns) {
            const rows = [];
            for (let from = 0; ; from += PAGE_SIZE) {
              const { data, error } = await supabase
                .from(table)
                .select(columns)
                .range(from, from + PAGE_SIZE - 1);

              if (error) throw error;
              rows.push(...(data || []));
              if (!data || data.length < PAGE_SIZE) return rows;
            }
          }

          function normalizeText(value) {
            return String(value || "")
              .toUpperCase()
              .replace(/&/g, " AND ")
              .replace(/\*/g, " ")
              .replace(/[^A-Z0-9]+/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function stripLocationSuffix(rawCustomer) {
            const raw = String(rawCustomer || "");
            const dashIndex = raw.indexOf(" - ");
            return dashIndex !== -1 ? raw.slice(0, dashIndex) : raw;
          }

          function getCustomerLocationKey(rawCustomer) {
            return normalizeText(stripLocationSuffix(rawCustomer));
          }

          function getMeaningfulWords(normalized) {
            return normalized.split(" ").filter((word) => word && !/^\d+$/.test(word));
          }

          function getFirstNWordsKey(raw, count) {
            return getMeaningfulWords(getCustomerLocationKey(raw)).slice(0, count).join(" ");
          }

          function getSignificantWords(raw) {
            return getCustomerLocationKey(raw)
              .split(" ")
              .filter((word) => word.length >= 4 && !/^\d+$/.test(word));
          }

          function categorizeRetailerName(rawRetailer) {
            const retailer = normalizeText(rawRetailer);
            if (!retailer) return "";
            if (retailer.includes("KROGER") || retailer === "KRO" || retailer.startsWith("KRO ")) return "Kroger";
            if (retailer.includes("FRESH THYME")) return "Fresh Thyme";
            if (retailer === "HEB" || retailer.includes(" HEB ")) return "HEB";
            return "INFRA & Others";
          }

          function directRetailerFromCustomer(custName) {
            const customer = normalizeText(custName);
            if (!customer) return "";

            const krogerBannerStarts = [
              "KROGER ",
              "KRO ",
              "DILLONS ",
              "PICK N SAVE ",
              "METRO MARKET ",
              "MARIANO S ",
              "MARIANOS ",
              "RALPHS ",
              "SMITH S ",
              "SMITHS ",
              "KING SOOPERS ",
              "CITY MARKET ",
              "FRYS ",
              "FRY S ",
              "FOOD 4 LESS ",
              "FRED MEYER ",
              "QFC ",
              "HARRIS TEETER ",
              "ROUNDY S ",
            ];

            if (
              krogerBannerStarts.some((prefix) => customer.startsWith(prefix)) ||
              customer.includes(" KROGER ") ||
              customer.includes(" KRO ") ||
              customer.endsWith(" KGR") ||
              customer.includes(" KGR ")
            ) {
              return "Kroger";
            }

            if (
              customer.includes("FRESH THYME") ||
              customer.includes("FRSH THYME") ||
              customer.includes("FRMR MKT")
            ) {
              return "Fresh Thyme";
            }

            if (customer === "HEB" || customer.startsWith("HEB ")) return "HEB";
            return "";
          }

          function buildLocationIndex(locations) {
            const exactCustomerMap = new Map();
            const twoWordMap = new Map();
            const oneWordMap = new Map();
            const wordMap = new Map();

            for (const loc of locations) {
              const exactKey = getCustomerLocationKey(loc.customer);
              const twoKey = getFirstNWordsKey(loc.customer, 2);
              const oneKey = getFirstNWordsKey(loc.customer, 1);
              const sigWords = getSignificantWords(loc.customer);

              if (exactKey && !exactCustomerMap.has(exactKey)) exactCustomerMap.set(exactKey, loc);
              if (twoKey && !twoWordMap.has(twoKey)) twoWordMap.set(twoKey, loc);
              if (oneKey && !oneWordMap.has(oneKey)) oneWordMap.set(oneKey, loc);
              for (const word of sigWords) {
                if (!wordMap.has(word)) wordMap.set(word, loc);
              }
            }

            return { exactCustomerMap, twoWordMap, oneWordMap, wordMap };
          }

          function findRetailer(row, index) {
            const trimmedCustomer = String(row.cust_name || "").trim();
            const skuSource = normalizeText(row.upc || "") || normalizeText(row.item || "");

            if (
              /KEHE DISTRIBUTORS DC/i.test(trimmedCustomer) ||
              /\bDC\s*\d+\b/i.test(trimmedCustomer)
            ) {
              if (skuSource.startsWith("HP")) return "Kroger";
              if (skuSource.startsWith("CK") || skuSource.startsWith("NSA")) return "Fresh Thyme";
            }

            if (/^DC\s*\d+$/i.test(trimmedCustomer)) return "";

            const exactMatch = index.exactCustomerMap.get(getCustomerLocationKey(trimmedCustomer));
            if (exactMatch) return categorizeRetailerName(exactMatch.retailer);

            const directRetailer = directRetailerFromCustomer(trimmedCustomer);
            if (directRetailer) return directRetailer;

            const twoMatch = index.twoWordMap.get(getFirstNWordsKey(trimmedCustomer, 2));
            if (twoMatch) return categorizeRetailerName(twoMatch.retailer);

            const oneMatch = index.oneWordMap.get(getFirstNWordsKey(trimmedCustomer, 1));
            if (oneMatch) return categorizeRetailerName(oneMatch.retailer);

            for (const word of getSignificantWords(trimmedCustomer)) {
              const wordMatch = index.wordMap.get(word);
              if (wordMatch) return categorizeRetailerName(wordMatch.retailer);
            }

            return "";
          }

          function isBlankOverride(value) {
            const normalized = String(value || "").trim();
            return !normalized || normalized === "-";
          }

          async function upsertInChunks(rows) {
            let updated = 0;
            for (let i = 0; i < rows.length; i += 500) {
              const chunk = rows.slice(i, i + 500);
              const { error, count } = await supabase
                .from("retailer_overrides")
                .upsert(chunk, { onConflict: "dataset_id", count: "exact" });

              if (error) throw error;
              updated += count || chunk.length;
            }
            return updated;
          }

          (async () => {
            const [datasetRows, locations, overrides] = await Promise.all([
              fetchAll("broker_commission_datasets", "id, cust_name, item, upc"),
              fetchAll("locations", "customer, retailer"),
              fetchAll("retailer_overrides", "dataset_id, retailer"),
            ]);

            const index = buildLocationIndex(locations);
            const overridesById = new Map(
              overrides.map((row) => [String(row.dataset_id), String(row.retailer || "")])
            );

            const payload = [];
            let inferredCount = 0;
            let preservedCount = 0;
            let marianosRows = 0;
            let marianosUpdated = 0;

            for (const row of datasetRows) {
              const customerKey = normalizeText(row.cust_name || "");
              const isMarianos = customerKey.includes("MARIANO S") || customerKey.includes("MARIANOS");
              if (isMarianos) marianosRows += 1;

              const inferredRetailer = findRetailer(row, index);
              if (!inferredRetailer) continue;
              inferredCount += 1;

              const existingRetailer = overridesById.get(String(row.id));
              if (!isBlankOverride(existingRetailer)) {
                if (existingRetailer !== inferredRetailer) preservedCount += 1;
                continue;
              }

              if (isMarianos && inferredRetailer === "Kroger") marianosUpdated += 1;

              payload.push({
                dataset_id: row.id,
                retailer: inferredRetailer,
                updated_at: new Date().toISOString(),
              });
            }

            const updatedRows = await upsertInChunks(payload);

            console.log(`dataset rows scanned: ${datasetRows.length}`);
            console.log(`locations scanned: ${locations.length}`);
            console.log(`existing overrides scanned: ${overrides.length}`);
            console.log(`rows with inferred retailer: ${inferredCount}`);
            console.log(`blank/missing overrides queued: ${payload.length}`);
            console.log(`retailer overrides upserted: ${updatedRows}`);
            console.log(`preserved nonblank conflicting overrides: ${preservedCount}`);
            console.log(`MARIANO rows scanned: ${marianosRows}`);
            console.log(`MARIANO rows queued as Kroger: ${marianosUpdated}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
