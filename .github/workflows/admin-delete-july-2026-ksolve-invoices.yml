name: Admin Delete July 2026 K-Solve Invoices

on:
  workflow_dispatch:

jobs:
  delete-july-2026-ksolve-invoices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Delete July 2026 K-Solve invoice rows
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'NODE'
          const { createClient } = require("@supabase/supabase-js");

          const supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const serviceRoleKey = process.env.SUPABASE_SERVICE_ROLE_KEY;

          if (!supabaseUrl || !serviceRoleKey) {
            throw new Error("Missing NEXT_PUBLIC_SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY.");
          }

          const supabase = createClient(supabaseUrl, serviceRoleKey);
          const julyShort = "July " + String.fromCharCode(39) + "26";

          function isJuly2026(row) {
            const month = String(row.month || "").trim().toLowerCase();
            if (month === julyShort.toLowerCase() || month === "july 2026") return true;

            const checkDate = String(row.check_date || "").trim();
            if (/^07\/\d{1,2}\/2026$/.test(checkDate)) return true;
            if (/^2026-07-\d{1,2}/.test(checkDate)) return true;

            const parsed = new Date(checkDate);
            return !Number.isNaN(parsed.getTime()) &&
              parsed.getFullYear() === 2026 &&
              parsed.getMonth() === 6;
          }

          async function fetchAllInvoiceRows() {
            const rows = [];
            const pageSize = 1000;

            for (let from = 0; ; from += pageSize) {
              const to = from + pageSize - 1;
              const { data, error } = await supabase
                .from("invoices")
                .select("id, month, check_date, invoice_number")
                .range(from, to);

              if (error) throw error;
              rows.push(...(data || []));
              if (!data || data.length < pageSize) return rows;
            }
          }

          async function deleteByIds(ids) {
            let deleted = 0;
            const chunkSize = 500;

            for (let i = 0; i < ids.length; i += chunkSize) {
              const chunk = ids.slice(i, i + chunkSize);
              const { error, count } = await supabase
                .from("invoices")
                .delete({ count: "exact" })
                .in("id", chunk);

              if (error) throw error;
              deleted += count || chunk.length;
            }

            return deleted;
          }

          (async () => {
            const rows = await fetchAllInvoiceRows();
            const idsToDelete = rows.filter(isJuly2026).map((row) => row.id);
            const deleted = await deleteByIds(idsToDelete);

            const remainingRows = await fetchAllInvoiceRows();
            const remainingJuly = remainingRows.filter(isJuly2026).length;

            console.log(`Total invoice rows scanned: ${rows.length}`);
            console.log(`July 2026 K-Solve invoice rows matched: ${idsToDelete.length}`);
            console.log(`July 2026 K-Solve invoice rows deleted: ${deleted}`);
            console.log(`July 2026 K-Solve invoice rows remaining: ${remainingJuly}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
